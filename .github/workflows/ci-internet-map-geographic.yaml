name: CI InternetMap-Geographic Frontend

on:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - "InternetMap-Geographic/**"
  #     - "docker-compose.yml"
  #     - ".github/workflows/ci-internet-map-geographic.yaml"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "InternetMap-Geographic/**"
  #     - "docker-compose.yml"
  #     - ".github/workflows/ci-internet-map-geographic.yaml"
  workflow_call:
    inputs:
      run-static-checks:
        type: boolean
        required: false
        default: true
      run-unit-tests:
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        type: boolean
        required: false
        default: true
      run-docker-build:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      run-static-checks:
        description: "Run static checks"
        type: boolean
        required: false
        default: true
      run-unit-tests:
        description: "Run unit tests"
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        description: "Run browser E2E tests"
        type: boolean
        required: false
        default: true
      run-docker-build:
        description: "Build Docker image"
        type: boolean
        required: false
        default: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  internet-map-geographic:
    name: InternetMap-Geographic Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: InternetMap-Geographic/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-static-checks }}
        run: pnpm run lint

      - name: Unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-unit-tests }}
        env:
          TEST_COVERAGE_SCOPE: |
            - utils/tools: nested route flattening, route lookup, image URL generation, compose-to-visualization conversion, and router weight ordering.
            - view/map3dGraph: stable undirected edge keys, transit-router detection, and AS highlight node generation for satellite-connected routers.
            - view/packetFlowAnalyzer: forward ICMP path construction, reply exclusion, and repeated live-flow deduplication.
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests }}
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests }}
        env:
          TEST_COVERAGE_SCOPE: |
            - Live emulator topology pages: Docker API-backed 3D/2D route loading and dock rendering.
            - Uploaded emulator topology pages: compose upload entry on both 3D and 2D routes.
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests) }}
        uses: actions/upload-artifact@v6
        with:
          name: internet-map-geographic-playwright-report
          path: InternetMap-Geographic/frontend/playwright-report

      - name: Docker build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-docker-build }}
        working-directory: .
        run: docker compose build seedemu_internet_map_geographic
