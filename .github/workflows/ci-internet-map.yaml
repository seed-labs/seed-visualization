name: CI Internet Map Frontend

on:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - "internet-map/**"
  #     - "docker-compose.yml"
  #     - ".github/workflows/ci-internet-map.yaml"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "internet-map/**"
  #     - "docker-compose.yml"
  #     - ".github/workflows/ci-internet-map.yaml"
  workflow_call:
    inputs:
      run-static-checks:
        type: boolean
        required: false
        default: true
      run-unit-tests:
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        type: boolean
        required: false
        default: true
      run-docker-build:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      run-static-checks:
        description: "Run static checks"
        type: boolean
        required: false
        default: true
      run-unit-tests:
        description: "Run unit tests"
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        description: "Run browser E2E tests"
        type: boolean
        required: false
        default: true
      run-docker-build:
        description: "Build Docker image"
        type: boolean
        required: false
        default: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  internet-map:
    name: Internet Map Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: internet-map/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-static-checks }}
        run: pnpm run lint

      - name: Unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-unit-tests }}
        env:
          TEST_COVERAGE_SCOPE: |
            - api/map: container and network query parameter construction.
            - api/plugin: plugin list, install, and uninstall request construction.
            - components/Pagination: page-size and current-page change callbacks.
            - utils/tools: nested route flattening, route lookup, image URL generation, compose-to-visualization conversion, and router weight ordering.
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Install Playwright browser
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests }}
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests }}
        env:
          TEST_COVERAGE_SCOPE: |
            - Dashboard: loading, empty, error, normal node/network tables, multi-interface nodes, and multi-network rendering.
            - Plugin page: plugin loading, keyword search, install action, and uninstall action.
            - 2D Map page: graph controls and packet filter submission.
            - IX Map page: settings panel and IX-specific controls.
            - Transit Map page: settings panel and transit controls.
            - Upload Map page: upload panel and shared 2D map controls.
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run-e2e-tests) }}
        uses: actions/upload-artifact@v6
        with:
          name: internet-map-playwright-report
          path: internet-map/frontend/playwright-report

      - name: Docker build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-docker-build }}
        working-directory: .
        run: docker compose build seedemu_internet_map
