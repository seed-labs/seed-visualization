  workflow_call: {}
  workflow_dispatch: {}

jobs:
  docker-lifecycle:
    name: Docker Lifecycle Probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build lifecycle images
        run: docker compose build seedemu_emulator_service seedemu_satellite_emulator_service seedmu_traffic_observer_service seedemu_internet_map_toplogy seedemu_internet_map_geographic seedemu_internet_map_satellite

      - name: Run compose lifecycle probes
        run: bash ci/probe-docker-compose.sh

      - name: Upload lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-lifecycle-artifacts
          path: ci-artifacts/docker-lifecycle
